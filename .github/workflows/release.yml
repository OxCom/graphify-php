name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Default deny; each job below requests only what it needs.
permissions: {}

# No `concurrency` block, unlike ci.yml: cancelling a publish half-way is worse
# than paying for the runner.

# The same three stage workflows ci.yml runs, with the publish on top, so a
# release passes exactly the checks a pull request does.
jobs:
  security:
    permissions:
      contents: read
    uses: ./.github/workflows/stage-security.yml

  tests:
    needs: security
    permissions:
      contents: read
    uses: ./.github/workflows/stage-tests.yml

  # stage-build takes a bare PEP 440 version, not a tag, so that it stays usable
  # from ci.yml where no tag exists. Stripping the leading "v" needs a shell:
  # GitHub's expression syntax has no substring operator.
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      value: ${{ steps.strip.outputs.value }}
    steps:
      - id: strip
        env:
          TAG: ${{ github.ref_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: [tests, version]
    permissions:
      contents: read
    uses: ./.github/workflows/stage-build.yml
    with:
      # Turns on the check that the version hatch-vcs computed from git history
      # equals the tag being released.
      expected_version: ${{ needs.version.outputs.value }}

  # Trusted publishing: PyPI trusts this workflow and the `pypi` environment
  # through OIDC, so no API token is stored in the repository.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The files stage-build produced and installed from a clean venv. Nothing
      # is rebuilt here: a second build could differ from the one the gates ran.
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        run: |
          python3 -m pip install "uv==0.12.5"
          python3 -m uv publish --trusted-publishing always dist/*
