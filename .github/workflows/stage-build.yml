name: stage-build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Every other job installs with `pip install -e .`, which imports straight
  # from src/ and never builds anything. A package left out of
  # [tool.hatch.build.targets.wheel] or a console script removed from
  # [project.scripts] produces a wheel that installs cleanly and does nothing.
  # This job is the gate for that. The version is static in pyproject.toml, so
  # there is no tag to compare against and no need for git history.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install the built wheel into a clean venv and run the entry point
        # A fresh venv outside the checkout has no src/ on sys.path, so the
        # import and the console script can only resolve against what the wheel
        # shipped. Run from $RUNNER_TEMP for the same reason.
        #
        # The wheel is installed alone, without graphify, so `--help` proves
        # the console script and the package import stand on their own. A real
        # build still needs graphify, which the test matrix covers.
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/wheelenv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelenv/bin/python" -c "import graphify_php; print(graphify_php.__name__)"
          "$RUNNER_TEMP/wheelenv/bin/graphify-php-build" --help

      - name: The wheel carries the PHPStan extension
        # Without php/ in the wheel the PHPStan source finds no autoload file and
        # drops out quietly, leaving tree-sitter alone. The lookup must resolve
        # inside the installed package, not in this checkout.
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelenv/bin/python" - <<'PY'
          from graphify_php.sources.phpstan_source import extension_autoload_file

          path = extension_autoload_file()
          assert path is not None, "php/autoload.php is missing from the wheel"
          assert "site-packages" in str(path), path
          assert (path.parent / "src" / "CallGraph").is_dir(), path
          print(path)
          PY

      - name: Upload dist artifacts
        # release.yml publishes these files rather than building its own copy,
        # so what a release ships is the artifact this job just proved
        # installable.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
